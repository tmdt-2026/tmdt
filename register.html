<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký - iLuxury</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        if (params.has("standalone")) {
          return;
        }
        const target = new URL("./index.html", window.location.href);
        target.searchParams.set("page", "register");
        if (window.location.pathname !== target.pathname) {
          window.location.replace(
            `${target.pathname}${target.search}${window.location.hash}`,
          );
        }
      })();
    </script>
  </head>
  <body>
    <header class="checkout-header">
      <div class="container">
        <div class="checkout-header-content">
          <a href="./index.html" class="checkout-logo" data-home-return>
            <i data-lucide="sparkles"></i>
            <span>iLuxury</span>
          </a>
          <div class="checkout-secure">
            <i data-lucide="user-plus"></i>
            <span>Tạo tài khoản mới</span>
          </div>
        </div>
      </div>
    </header>

    <main class="order-page">
      <div class="container container-narrow">
        <section class="order-page-head">
          <h1>Đăng ký tài khoản</h1>
          <p>Tạo tài khoản iLuxury để mua sắm nhanh và lưu lịch sử đơn hàng.</p>
        </section>

        <section class="order-detail-card account-form-card auth-form-card">
          <form class="account-form" id="register-form">
            <div class="form-row">
              <div class="form-group">
                <label for="register-fullname">Họ và tên</label>
                <input
                  id="register-fullname"
                  type="text"
                  placeholder="Nguyễn Văn A"
                  required
                />
              </div>
              <div class="form-group">
                <label for="register-phone">Số điện thoại</label>
                <input
                  id="register-phone"
                  type="tel"
                  placeholder="0912345678"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <label for="register-email">Email</label>
              <input
                id="register-email"
                type="email"
                placeholder="email@iluxury.vn"
                required
              />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="register-password">Mật khẩu</label>
                <input
                  id="register-password"
                  type="password"
                  minlength="6"
                  required
                />
              </div>
              <div class="form-group">
                <label for="register-confirm-password">Xác nhận mật khẩu</label>
                <input
                  id="register-confirm-password"
                  type="password"
                  minlength="6"
                  required
                />
              </div>
            </div>
            <label class="auth-terms-check">
              <input id="register-accept" type="checkbox" />
              <span
                >Tôi đồng ý với điều khoản và chính sách bảo mật của
                iLuxury.</span
              >
            </label>
            <div class="checkout-actions">
              <a href="./index.html?page=login" class="btn btn-secondary"
                >Đã có tài khoản</a
              >
              <button type="submit" class="btn btn-primary">Đăng ký</button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script type="module" src="./js/pages/home-return.js"></script>
    <script type="module" src="./js/pages/register.js"></script>
  </body>
</html>
