<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông Tin Tài Khoản - iLuxury</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        if (params.has("standalone")) {
          return;
        }
        let auth = null;
        try {
          const raw = localStorage.getItem("iluxury_auth");
          auth = raw ? JSON.parse(raw) : null;
        } catch (error) {
          auth = null;
        }
        const target = new URL("./index.html", window.location.href);
        target.searchParams.set(
          "page",
          auth?.isAuthenticated ? "account-profile" : "login",
        );
        if (window.location.pathname !== target.pathname) {
          window.location.replace(
            `${target.pathname}${target.search}${window.location.hash}`,
          );
        }
      })();
    </script>
  </head>
  <body>
    <header class="checkout-header">
      <div class="container">
        <div class="checkout-header-content">
          <a href="./index.html" class="checkout-logo" data-home-return>
            <i data-lucide="sparkles"></i>
            <span>iLuxury</span>
          </a>
          <div class="checkout-secure">
            <i data-lucide="user-cog"></i>
            <span>Thông tin tài khoản</span>
          </div>
        </div>
      </div>
    </header>

    <main class="order-page">
      <div class="container container-narrow">
        <section class="order-page-head">
          <h1>Thông tin tài khoản</h1>
          <p>Cập nhật thông tin cá nhân để iLuxury phục vụ bạn tốt hơn.</p>
        </section>

        <section class="order-detail-card account-form-card">
          <form class="account-form" id="account-profile-form">
            <div class="form-row">
              <div class="form-group">
                <label for="profile-fullname">Họ và tên</label>
                <input
                  id="profile-fullname"
                  type="text"
                  placeholder="Nguyễn Văn A"
                />
              </div>
              <div class="form-group">
                <label for="profile-phone">Số điện thoại</label>
                <input id="profile-phone" type="tel" placeholder="0912345678" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="profile-email">Email</label>
                <input
                  id="profile-email"
                  type="email"
                  placeholder="email@iluxury.vn"
                />
              </div>
              <div class="form-group">
                <label for="profile-birthday">Ngày sinh</label>
                <input id="profile-birthday" type="date" />
              </div>
            </div>
            <div class="checkout-actions">
              <a href="./index.html" class="btn btn-secondary" data-home-return
                >Quay lại trang chủ</a
              >
              <button type="submit" class="btn btn-primary">
                Lưu thay đổi
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script type="module" src="./js/pages/home-return.js"></script>
    <script type="module" src="./js/pages/account-profile.js"></script>
  </body>
</html>
