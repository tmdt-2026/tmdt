<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đổi Mật Khẩu - iLuxury</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        if (params.has("standalone")) {
          return;
        }
        let auth = null;
        try {
          const raw = localStorage.getItem("iluxury_auth");
          auth = raw ? JSON.parse(raw) : null;
        } catch (error) {
          auth = null;
        }
        const target = new URL("./index.html", window.location.href);
        target.searchParams.set(
          "page",
          auth?.isAuthenticated ? "change-password" : "login",
        );
        if (window.location.pathname !== target.pathname) {
          window.location.replace(
            `${target.pathname}${target.search}${window.location.hash}`,
          );
        }
      })();
    </script>
  </head>
  <body>
    <header class="checkout-header">
      <div class="container">
        <div class="checkout-header-content">
          <a href="./index.html" class="checkout-logo" data-home-return>
            <i data-lucide="sparkles"></i>
            <span>iLuxury</span>
          </a>
          <div class="checkout-secure">
            <i data-lucide="key-round"></i>
            <span>Đổi mật khẩu</span>
          </div>
        </div>
      </div>
    </header>

    <main class="order-page">
      <div class="container container-narrow">
        <section class="order-page-head">
          <h1>Đổi mật khẩu</h1>
          <p>Bảo mật tài khoản bằng cách cập nhật mật khẩu định kỳ.</p>
        </section>

        <section class="order-detail-card account-form-card">
          <form class="account-form" id="change-password-form">
            <div class="form-group">
              <label for="current-password">Mật khẩu hiện tại</label>
              <input id="current-password" type="password" required />
            </div>
            <div class="form-group">
              <label for="new-password">Mật khẩu mới</label>
              <input id="new-password" type="password" minlength="6" required />
            </div>
            <div class="form-group">
              <label for="confirm-password">Nhập lại mật khẩu mới</label>
              <input
                id="confirm-password"
                type="password"
                minlength="6"
                required
              />
            </div>
            <div class="checkout-actions">
              <a href="./index.html" class="btn btn-secondary" data-home-return
                >Quay lại trang chủ</a
              >
              <button type="submit" class="btn btn-primary">
                Cập nhật mật khẩu
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script type="module" src="./js/pages/home-return.js"></script>
    <script type="module" src="./js/pages/change-password.js"></script>
  </body>
</html>
